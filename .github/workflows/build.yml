name: Build, push and deploy gateway

on:
  push:
    branches: [main]
  # Push publishes only. A main-branch manual dispatch records an operator's
  # revision + expected digest; Coolify must already be pinned. See deploy/coolify/DEPLOY-FLOW.md.
  workflow_dispatch:
    inputs:
      revision:
        description: Full main commit SHA of an already published artifact
        required: true
        type: string
      digest:
        description: Expected sha256 digest from the publication record
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: build-gateway-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: bawes-universe
  IMAGE_NAME: studenthub-gateway

jobs:
  env-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # pull_request_target exposes secrets, so this job executes only the
      # trusted base revision. It downloads the PR's declarative JSON manifest
      # as data and never checks out or executes PR-controlled code.
      - name: Checkout trusted deployment checker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Read proposed manifest without executing pull-request code
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/deploy/coolify/deployment-env-manifest.json?ref=${MANIFEST_REF}" \
            --output "${RUNNER_TEMP}/deployment-env-manifest.json"

      - name: Verify required Coolify deployment environment
        if: ${{ github.event_name != 'pull_request_target' }}
        env:
          COOLIFY_BASE: ${{ secrets.COOLIFY_BASE }}
          COOLIFY_READ_TOKEN: ${{ secrets.COOLIFY_READ_TOKEN }}
          COOLIFY_STUDENTHUB_GATEWAY_UUID: ${{ secrets.COOLIFY_STUDENTHUB_GATEWAY_UUID }}
        run: node deploy/coolify/check-env-manifest.mjs

      - name: Validate proposed manifest as untrusted data
        if: ${{ github.event_name == 'pull_request_target' }}
        run: node deploy/coolify/deployment-env-manifest.mjs "${RUNNER_TEMP}/deployment-env-manifest.json"

      - name: Verify trusted Coolify deployment environment
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          COOLIFY_BASE: ${{ secrets.COOLIFY_BASE }}
          COOLIFY_READ_TOKEN: ${{ secrets.COOLIFY_READ_TOKEN }}
          COOLIFY_STUDENTHUB_GATEWAY_UUID: ${{ secrets.COOLIFY_STUDENTHUB_GATEWAY_UUID }}
        run: node deploy/coolify/check-env-manifest.mjs

  build-push:
    if: ${{ github.event_name == 'push' }}
    needs: env-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      immutable-tag: ${{ steps.record.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published artifact
        id: record
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, writeFileSync } from 'node:fs';
          const { GITHUB_SHA: revision, DIGEST: digest } = process.env;
          if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw new Error('missing pushed digest');
          const tag = `main-${revision}`;
          const image = 'ghcr.io/bawes-universe/studenthub-gateway';
          const record = { revision, tag, digest, image, pin: `${image}@${digest}`, runId: process.env.GITHUB_RUN_ID };
          writeFileSync('published-artifact.json', JSON.stringify(record) + '\n');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, JSON.stringify(record) + '\n');
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: published-artifact-${{ github.sha }}-${{ github.run_attempt }}
          path: published-artifact.json
          if-no-files-found: error

  deploy:
    # Never deploy on push or pull_request_target. Inputs and actor remain in run history.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: env-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select and record immutable artifact
        env:
          REVISION: ${{ inputs.revision }}
          EXPECTED_DIGEST: ${{ inputs.digest }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync, appendFileSync } from 'node:fs';
          import { selectArtifact } from './deploy/coolify/select-artifact.mjs';
          const selection = selectArtifact(process.env.REVISION);
          execFileSync('git', ['merge-base', '--is-ancestor', selection.revision, process.env.GITHUB_SHA]);
          if (selection.digest !== process.env.EXPECTED_DIGEST) throw new Error('published digest does not match operator selection');
          const record = { ...selection, actor: process.env.GITHUB_ACTOR, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT };
          writeFileSync('selected-artifact.json', JSON.stringify(record) + '\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, JSON.stringify(record) + '\n');
          JS
      # Upload must succeed before any deployment request is possible.
      - uses: actions/upload-artifact@v4
        with:
          name: selected-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: selected-artifact.json
          if-no-files-found: error
      - name: Verify existing digest pin and trigger Coolify
        env:
          COOLIFY_BASE: ${{ secrets.COOLIFY_BASE }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_STUDENTHUB_GATEWAY_UUID: ${{ secrets.COOLIFY_STUDENTHUB_GATEWAY_UUID }}
        run: node deploy/coolify/trigger-selected.mjs selected-artifact.json
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-receipt.json
          if-no-files-found: error
