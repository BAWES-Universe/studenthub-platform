name: Build, push and deploy gateway

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: build-gateway-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  # Serialize publication, tag promotion, verification and rollback.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: bawes-universe
  IMAGE_NAME: studenthub-gateway

jobs:
  runtime-scope:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.fingerprint.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node deploy/coolify/runtime-change.mjs

      - uses: actions/setup-node@v4
        if: ${{ steps.scope.outputs.changed == 'true' }}
        with:
          node-version: 22
      - name: Compare actual runtime closure across the push
        id: fingerprint
        if: ${{ steps.scope.outputs.changed == 'true' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          npm ci --ignore-scripts
          npm run build
          node deploy/coolify/runtime-fingerprint.mjs . > "${RUNNER_TEMP}/runtime-after"
          git worktree add --detach "${RUNNER_TEMP}/runtime-before" "$BEFORE_SHA"
          npm ci --ignore-scripts --prefix "${RUNNER_TEMP}/runtime-before"
          npm run build --prefix "${RUNNER_TEMP}/runtime-before"
          node deploy/coolify/runtime-fingerprint.mjs "${RUNNER_TEMP}/runtime-before" > "${RUNNER_TEMP}/runtime-before-hash"
          if cmp -s "${RUNNER_TEMP}/runtime-after" "${RUNNER_TEMP}/runtime-before-hash"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  env-manifest:
    needs: runtime-scope
    if: ${{ always() && (github.event_name == 'pull_request_target' || needs.runtime-scope.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # pull_request_target exposes secrets, so this job executes only the
      # trusted base revision. It downloads the PR's declarative JSON manifest
      # as data and never checks out or executes PR-controlled code.
      - name: Checkout trusted deployment checker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Read proposed manifest without executing pull-request code
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/deploy/coolify/deployment-env-manifest.json?ref=${MANIFEST_REF}" \
            --output "${RUNNER_TEMP}/deployment-env-manifest.json"

      - name: Verify required Coolify deployment environment
        if: ${{ github.event_name != 'pull_request_target' }}
        env:
          COOLIFY_BASE: ${{ secrets.COOLIFY_BASE }}
          COOLIFY_READ_TOKEN: ${{ secrets.COOLIFY_READ_TOKEN }}
          COOLIFY_STUDENTHUB_GATEWAY_UUID: ${{ secrets.COOLIFY_STUDENTHUB_GATEWAY_UUID }}
        run: node deploy/coolify/check-env-manifest.mjs

      - name: Validate proposed manifest as untrusted data
        if: ${{ github.event_name == 'pull_request_target' }}
        run: node deploy/coolify/deployment-env-manifest.mjs "${RUNNER_TEMP}/deployment-env-manifest.json"

      - name: Verify trusted Coolify deployment environment
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          COOLIFY_BASE: ${{ secrets.COOLIFY_BASE }}
          COOLIFY_READ_TOKEN: ${{ secrets.COOLIFY_READ_TOKEN }}
          COOLIFY_STUDENTHUB_GATEWAY_UUID: ${{ secrets.COOLIFY_STUDENTHUB_GATEWAY_UUID }}
        run: node deploy/coolify/check-env-manifest.mjs

  build-push:
    if: ${{ github.event_name == 'push' }}
    needs: env-manifest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: studenthub_authz
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      immutable-tag: ${{ steps.record.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the exact published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DATABASE_URL: postgres://postgres@localhost:55432/studenthub_authz
        run: bash deploy/coolify/image-smoke.sh "${REGISTRY}/${IMAGE_PREFIX}/${IMAGE_NAME}@${DIGEST}"

      - name: Record published artifact
        id: record
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, writeFileSync } from 'node:fs';
          const { GITHUB_SHA: revision, DIGEST: digest } = process.env;
          if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw new Error('missing pushed digest');
          const tag = `main-${revision}`;
          const image = 'ghcr.io/bawes-universe/studenthub-gateway';
          const record = { revision, tag, digest, image, pin: `${image}@${digest}`, runId: process.env.GITHUB_RUN_ID };
          writeFileSync('published-artifact.json', JSON.stringify(record) + '\n');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, JSON.stringify(record) + '\n');
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: published-artifact-${{ github.sha }}-${{ github.run_attempt }}
          path: published-artifact.json
          if-no-files-found: error

  deploy:
    # Only runtime main pushes whose exact published digest passed image smoke.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      outcome: ${{ steps.rollout.outputs.outcome }}
    permissions:
      contents: read
      packages: write
      issues: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: studenthub_authz
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record smoke-tested artifact
        env:
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { selectArtifact } from './deploy/coolify/select-artifact.mjs';
          const selection = selectArtifact(process.env.GITHUB_SHA);
          if (selection.digest !== process.env.DIGEST) throw new Error('artifact differs from smoke-tested digest');
          writeFileSync('selected-artifact.json', JSON.stringify(selection) + '\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: selected-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: selected-artifact.json
          if-no-files-found: error
      - name: Automatically deploy and verify staging with rollback and freeze
        id: rollout
        env:
          COOLIFY_BASE: ${{ secrets.COOLIFY_BASE }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_STUDENTHUB_GATEWAY_UUID: ${{ secrets.COOLIFY_STUDENTHUB_GATEWAY_UUID }}
          GH_TOKEN: ${{ github.token }}
          DATABASE_URL: postgres://postgres@localhost:55432/studenthub_authz
        run: node deploy/coolify/automatic-staging.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: deployment-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-receipt.json
          if-no-files-found: warn

  staging-stop:
    needs: [runtime-scope, env-manifest, build-push, deploy]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain staging freeze and notify through GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.env-manifest.result == 'failure' && 'PRECONDITION_NOT_MET' || needs.deploy.outputs.outcome }}
        run: node deploy/coolify/report-staging-stop.mjs
