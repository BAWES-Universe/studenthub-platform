name: Staging on-dev

# Puts a pull request's code on staging (https://staging.studenthub.co) for hands-on testing.
#
# - Add the `on-dev` label to a PR: its branch is built, smoke-tested and staging switches to it.
#   Staging has one slot, so labelling a PR takes the label off any other open PR.
# - Push to a labelled PR: it is rebuilt and staging follows.
# - Remove the label, merge or close the PR: staging returns to the latest main.
# - Run it by hand (Actions > Staging on-dev > Run workflow) to put any branch on staging
#   while no PR holds the label.
#
# Staging is a test site. Production has no path here. PRs from forks are ignored.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to put on staging (main returns staging to the default)
        required: true
        default: main

permissions:
  contents: read

env:
  LABEL: on-dev
  DEFAULT_BRANCH: main
  REGISTRY: ghcr.io
  IMAGE_PREFIX: bawes-universe
  IMAGE_NAME: studenthub-gateway

jobs:
  decide:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    # Label decisions run one at a time, so two PRs taking the label can't remove each other's.
    concurrency:
      group: staging-label
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    outputs:
      branch: ${{ steps.decide.outputs.branch }}
      pr: ${{ steps.decide.outputs.pr }}
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          persist-credentials: false

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          HAD_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'on-dev') }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: node deploy/coolify/staging-ownership.mjs decide

  build:
    # Builds and smoke-tests the selected branch. It runs branch code, so it gets no Coolify secrets.
    needs: decide
    if: needs.decide.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      digest: ${{ steps.build.outputs.digest }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: studenthub_authz
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.branch }}
          persist-credentials: false

      - id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SOURCE_REVISION=${{ steps.target.outputs.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}:dev-${{ steps.target.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the exact pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DATABASE_URL: postgres://postgres@localhost:55432/studenthub_authz
        run: bash deploy/coolify/image-smoke.sh "${REGISTRY}/${IMAGE_PREFIX}/${IMAGE_NAME}@${DIGEST}"

  switch:
    # Holds the Coolify secrets, so it runs only the deployment code on main, never branch code.
    needs: [decide, build]
    if: always() && needs.decide.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One switch at a time, shared with the main deploy in build.yml. Never cancel one half-way.
    concurrency:
      group: staging-switch
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        if: needs.build.result == 'success'
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4
        if: needs.build.result == 'success'

      - uses: docker/login-action@v4
        if: needs.build.result == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check staging is still this run's to change
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.decide.outputs.mode }}
          PR: ${{ needs.decide.outputs.pr }}
          BRANCH: ${{ needs.decide.outputs.branch }}
          SHA: ${{ needs.build.outputs.sha }}
        run: node deploy/coolify/staging-ownership.mjs guard

      - name: Switch staging and verify it serves this revision
        id: switch
        if: needs.build.result == 'success'
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ needs.build.outputs.sha }}
          COOLIFY_BASE: ${{ secrets.COOLIFY_BASE }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_STUDENTHUB_GATEWAY_UUID: ${{ secrets.COOLIFY_STUDENTHUB_GATEWAY_UUID }}
        run: node deploy/coolify/staging-switch.mjs

      - name: Tell the pull request
        if: always() && needs.decide.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.decide.outputs.pr }}
          SHA: ${{ needs.build.outputs.sha }}
          OUTCOME: ${{ steps.switch.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = success ]; then
            body="Staging now runs this PR at ${SHA::7}: https://staging.studenthub.co"
          else
            body="Putting this PR on staging failed; staging may still run the previous build. Run: $RUN"
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
