name: M-4 importer build pin

# A fresh checkout of this exact commit gets the pinned Node runtime
# (tools/legacy-import/install-runtime.sh: exact version, checksum-verified official archive),
# then `npm ci --ignore-scripts` and `npm run build` with that runtime, with nothing else run first.
# It prints the digest of the whole checkout the M-4 importer would load, runtime included. The pin
# line is issued (exit 0) only for a clean, complete build whose HEAD is the declared commit, made
# by the checkout's own pinned runtime, and says where it came from (source=push or pull_request).
# For a main push it also keeps that exact verified build as the artifact m4-runtime-<commit>, so
# staging can run the very bytes this run hashed instead of rebuilding them.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  m4-build-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned Node runtime
        run: sh tools/legacy-import/install-runtime.sh
      - name: Install and build with the pinned runtime
        run: |
          export PATH="$PWD/.runtime/node/bin:$PATH"
          npm ci --ignore-scripts
          npm run build
      - name: Pin the M-4 importer build
        env:
          PIN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PIN_SOURCE: ${{ github.event_name }}
        run: .runtime/node/bin/node tools/legacy-import/m4-launch.mjs provenance --expect "$PIN_COMMIT" --source "$PIN_SOURCE" | tee "$RUNNER_TEMP/m4-pin.txt"
      - name: Package the exact verified build
        if: github.event_name == 'push'
        run: |
          mkdir "$RUNNER_TEMP/m4-runtime"
          tar --numeric-owner --owner=0 --group=0 -czf "$RUNNER_TEMP/m4-runtime/m4-runtime-$GITHUB_SHA.tar.gz" .
          cp "$RUNNER_TEMP/m4-pin.txt" "$RUNNER_TEMP/m4-runtime/m4-pin.txt"
          (cd "$RUNNER_TEMP/m4-runtime" && sha256sum "m4-runtime-$GITHUB_SHA.tar.gz" > SHA256SUMS)
      - name: Keep the exact verified build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m4-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/m4-runtime
          retention-days: 30
          if-no-files-found: error
