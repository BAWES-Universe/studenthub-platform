name: Verify claim manifests

# The second half of the receipt authority. `verifier-receipt.yml` produces receipts; this workflow checks
# that a candidate's pins actually describe runs that exist, and that the receipt inside each one records the
# tests the candidate claims. A pin is a small JSON object, so the authoring lane can write one - and a pin
# nobody verifies is worth exactly as much as the forged receipt file it replaced. This is where a pin stops
# being a claim and starts being evidence, and it runs from protected main, so a candidate cannot choose the
# code that judges it.
#
# It is deliberately cheap: it re-fetches runs that already exist rather than running the suite again.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Commit whose committed claim manifest should be verified
        required: true

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  # The tools that turn a pin into evidence are themselves checked, from the protected checkout, before any pin
  # is judged. Their tests stub `gh`, so they need no token and no network, and they assert the refusals: a run
  # that is not a dispatch of this workflow on main, an archive whose bytes are not the ones GitHub digested, a
  # receipt with no attestation, a receipt belonging to another run, an attestation naming another workflow, a
  # rule whose fetched bytes disagree with the blob id the API reports, a fetch the API will not serve, a run
  # that is not the protected branch's (which emits no pin at all), and a manifest carrying no pin for the run
  # being verified.
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Test the receipt tooling
        run: node --test --test-reporter=tap .github/verifier-receipt/test/*.test.mjs

  verify:
    needs: selftest
    runs-on: ubuntu-latest
    steps:
      # The verifier comes from the dispatching ref - protected main - and never from the candidate.
      - name: Check out the verifier from the protected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: verifier

      - name: Check out the candidate for its manifest and receipts
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate

      # A candidate that touches the authority is refused outright: it cannot be measured by a verifier it
      # could have altered, and it cannot use this run to approve the change that introduces it.
      # Read the changed file list from the API rather than from local history: merging and diffing need a
      # merge base, and a checkout by SHA has none. The API's comparison is computed by GitHub, so a candidate
      # cannot influence it either.
      - name: Refuse a candidate that alters the receipt authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed=$(gh api "/repos/$REPO/compare/main...${{ inputs.candidate_sha }}" --jq '.files[].filename')
          touched=$(printf '%s\n' "$changed" | grep -E '^(\.github/workflows/verifier-receipt\.yml|\.github/verifier-receipt/)' || true)
          if [ -n "$touched" ]; then
            echo "::error::this candidate changes the receipt authority, so no receipt it or this workflow produces may approve it"
            printf '%s\n' "$touched"
            exit 1
          fi
          echo "the candidate does not alter the receipt authority"

      - name: Verify every pin the candidate's manifest carries
        if: hashFiles('candidate/.github/coordinator/service/verifier-receipts.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd candidate
          pins=$(node -e "
            const fs = require('fs');
            const body = JSON.parse(fs.readFileSync('.github/coordinator/service/verifier-receipts.json', 'utf8'));
            const pins = Array.isArray(body) ? body : body.pins ?? [];
            for (const pin of pins) console.log(pin.run_id);
          ")
          if [ -z "$pins" ]; then
            echo "no pins: the manifest can carry no PASS, which is a state and not a failure"
            exit 0
          fi
          for run in $pins; do
            echo "::group::verifying run $run"
            # The authority's own fetch tool, run from the protected ref: it reads the run, the artifact and
            # the attestation back from the API and refuses anything that does not match.
            #
            # It also refuses to emit a pin unless the run it is part of is itself on the protected branch,
            # reading GITHUB_REF and GITHUB_EVENT_NAME, which Actions sets before node starts. This workflow
            # is workflow_dispatch-only and is dispatched on main, so those are refs/heads/main and
            # workflow_dispatch here. A copy of this workflow running from a pull request head would get an
            # advisory report on stderr and a non-zero exit instead, which is the intended outcome: on a
            # pull_request event the tool and every file it reads are the candidate's.
            node ../verifier/.github/verifier-receipt/fetch-receipt.mjs --repo "$REPO" --run "$run" \
              --out "/tmp/pin-$run.json"
            # The pin the candidate wrote must be the pin the API produces, field for field, or the candidate
            # is asking to be judged on a run that does not say what it claims. The comparison is the
            # verifier's own module, run from the protected checkout like the fetch tool beside it: it used to
            # be a `node -e` string here, and a string in a step body is a thing no test can reach.
            node ../verifier/.github/verifier-receipt/compare-pin.mjs \
              --fetched "/tmp/pin-$run.json" \
              --manifest .github/coordinator/service/verifier-receipts.json
            echo "::endgroup::"
          done

      - name: Report what this proves
        working-directory: candidate
        run: |
          echo "Every pin in this candidate's manifest describes a run that exists; whose artifact digest"
          echo "GitHub computed and whose downloaded archive hashes to it; whose receipt was taken out of that"
          echo "archive, is attested by GitHub under the protected workflow ref, and is admissible under the"
          echo "rule fetched from refs/heads/main; and whose recorded verdict and identity fields match what"
          echo "the candidate committed. The receipt's own hash is the attestation's subject and is NOT the"
          echo "artifact digest - the two are hashes of different objects. Terms with no pin remain BLOCK."
