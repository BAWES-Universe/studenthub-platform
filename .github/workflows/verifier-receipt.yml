name: Verifier receipt

# The receipt producer: it answers one question about one commit - what did that commit's own suite report, and
# what does its claim name?
#
# PROVENANCE IS THE SECURITY PROPERTY, and it is what the three-job split exists to produce. A review defeated
# the single-job version: run the candidate's suite and emit the receipt in one job, and the code being measured
# is the code deciding what the receipt says. A later review defeated the two-job version too: the emitter was
# handed a file by path and asked only whether it looked like TAP, so a hand-written stream was accepted as a
# measurement. Looking harder at the stream cannot fix that - a candidate's own test file prints well-formed TAP.
# What fixes it is that the emitter accepts no bytes it did not fetch itself, from this run's own artifact.
#
#   trust   - resolves the authority commit (the workflow, the emitter, the runner enum), the candidate, and the
#             runner key. Nothing it resolves comes from the candidate's tree.
#   measure - checks out the candidate, invokes the command the PROTECTED runner enum names for the chosen key -
#             never the candidate's package.json, never a shell string anyone supplied - and HASHES THE OUTPUT
#             STREAM AS IT PASSES THROUGH a trusted process, which then writes the capture and its meta after the
#             runner is gone and uploads them as this job's own artifact. No id-token, no attestation permission.
#             A review defeated the earlier form, which hashed a file in a later step: the measured suite could
#             rename a forged stream over that file. What that fix establishes and what it cannot is stated in
#             full at the capture step and in capture-stream.mjs - the measured tests print into the very stream
#             being hashed, so this authenticates the bytes' origin, never their truthfulness.
#   emit    - checks out the authority by SHA and runs the emitter. It never checks out the candidate and never
#             downloads any artifact into its workspace: it locates the measure job's artifact through the API by
#             run id and name, checks the digest GitHub computed, and reads the capture out of the archive GitHub
#             serves. The claim is fetched from the candidate commit through the contents API. It holds NO
#             signing permission: a review found the rehearsal posture running head-supplied code in a job that
#             held `attestations: write`, so minting moved out of it.
#   attest  - the only job holding `id-token: write` and `attestations: write`, and it runs only on a
#             workflow_dispatch of the default branch. It re-reads admissibility out of the receipt it is about
#             to sign. What that does and does not bind is written out in full at the job itself.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Commit to measure
        required: true
      runner_key:
        description: Which suite of the protected runner enum to invoke
        required: false
        default: coordinator
        # A CLOSED ENUM, and the only runner control a caller has. The command text lives in
        # .github/verifier-receipt/runners.json on the protected ref; a key does not carry one.
        type: choice
        options:
          - coordinator
          - coordinator-core
          - coordinator-service
  # workflow_dispatch registers only for workflows on the default branch, so a change to this authority cannot
  # be exercised by dispatch until it merges. A pull_request run rehearses the whole chain for real - real job,
  # real artifact, real API - against the candidate fixed in the authority's own rehearsal file.
  #
  # WHAT STOPS A REHEARSAL FROM MINTING, and where that stops binding - because two versions of this comment
  # have now claimed more than the files deliver. In this workflow AS WRITTEN: the emitter marks such a receipt
  # admissible_as_pin=false; the gate refuses to publish an admissible output that disagrees with the receipt's
  # own body; the emit job holds no signing permission at all; and the `attest` job, which holds the only one,
  # runs only on a workflow_dispatch of the default branch and re-reads the field out of the subject.
  #
  # AND THE PART THAT IS NOT ENFORCED BY ANY OF THAT: on a pull_request event GitHub runs the workflow
  # DEFINITION from the pull request head, so for such a run every line above is the candidate author's to
  # rewrite. Nothing in this repository prevents that; what does is the repository's Actions settings and a
  # consumer that requires provenance.admissible_as_pin, conclusion.verdict === 'success' and an attestation
  # whose workflow REF is the protected branch. `verify-claim.yml` does not exist on this branch and nothing
  # here reads a pin, so any consumer of these receipts must do all three itself.
  pull_request:
    paths:
      - .github/workflows/verifier-receipt.yml
      - .github/verifier-receipt/**

permissions:
  contents: read
  actions: read

jobs:
  trust:
    name: Resolve the authority commit, the candidate and the runner
    runs-on: ubuntu-latest
    # Two checkouts and a handful of API reads; nothing here invokes candidate code and nothing here can loop.
    # Bounded anyway, so that NO job of this workflow can hold a hosted runner for GitHub's 360-minute default
    # on the way to a cancellation that says nothing. 10 minutes is far above anything this job has taken.
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      trusted_sha: ${{ steps.resolve.outputs.trusted_sha }}
      trusted_origin: ${{ steps.resolve.outputs.trusted_origin }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      runner_key: ${{ steps.resolve.outputs.runner_key }}
    steps:
      - name: Resolve what this run is allowed to trust
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_CANDIDATE: ${{ inputs.candidate_sha }}
          DISPATCH_RUNNER: ${{ inputs.runner_key }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            trusted_sha="$DISPATCH_SHA"
            if [ "$DISPATCH_REF" = "refs/heads/main" ]; then
              trusted_origin="protected-main"
            else
              trusted_origin="dispatch-ref:$DISPATCH_REF"
            fi
            candidate_sha="$DISPATCH_CANDIDATE"
            runner_key="${DISPATCH_RUNNER:-coordinator}"
          else
            # Prefer the base branch by SHA: on a pull request the workflow file itself comes from the head, but
            # the emitter, the runner enum and the rehearsal pin do not have to. They can only come from the base
            # once this authority exists there, so check, and say plainly which was used.
            if gh api "/repos/$REPO/contents/.github/verifier-receipt/runners.json?ref=$PR_BASE_SHA" >/dev/null 2>&1 \
               && [ "$PR_BASE_REF" = "${DEFAULT_BRANCH:-main}" ]; then
              trusted_sha="$PR_BASE_SHA"
              trusted_origin="protected-main"
            else
              trusted_sha="$PR_HEAD_SHA"
              trusted_origin="pull-request-head"
              echo "::warning::the receipt authority is not present on $PR_BASE_REF at $PR_BASE_SHA, so this rehearsal runs the authority from the pull request head; its receipt is not admissible as a pin"
            fi
            rehearsal=$(gh api "/repos/$REPO/contents/.github/verifier-receipt/pull-request-rehearsal.json?ref=$trusted_sha" --jq '.content' | base64 -d)
            candidate_sha=$(printf '%s' "$rehearsal" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).candidate_sha))")
            runner_key=$(printf '%s' "$rehearsal" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).runner_key))")
          fi

          case "$candidate_sha" in
            *[!0-9a-f]* | "") echo "::error::candidate sha is not a hex commit id: $candidate_sha"; exit 1 ;;
          esac
          if [ "${#candidate_sha}" -ne 40 ]; then
            candidate_sha=$(gh api "/repos/$REPO/commits/$candidate_sha" --jq '.sha')
          fi
          case "$runner_key" in
            coordinator|coordinator-core|coordinator-service) ;;
            *) echo "::error::runner key \"$runner_key\" is not in this workflow's closed enum"; exit 1 ;;
          esac

          {
            echo "trusted_sha=$trusted_sha"
            echo "trusted_origin=$trusted_origin"
            echo "candidate_sha=$candidate_sha"
            echo "runner_key=$runner_key"
          } >> "$GITHUB_OUTPUT"
          echo "authority $trusted_sha ($trusted_origin); candidate $candidate_sha; runner $runner_key"

      # An early, cheap refusal. The emitter re-checks this from the API itself and refuses independently, so a
      # drift here loosens nothing - it only wastes a suite run before the refusal lands.
      #
      # It asks the same question the emitter asks, the same way: the OBJECT ID of each authority path on main
      # and at the candidate. This step used to read `.files[].filename` from `compare/main...<candidate>`,
      # which has two holes the emitter's comment records in full - GitHub caps that list at 300 entries and
      # truncates it silently in filename order, and it reports a rename under its new name only. An id is
      # neither a page of a list nor a name.
      - name: Refuse a candidate that alters the receipt authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.resolve.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          object_id() {  # directory, entry name, ref -> the entry's sha, or empty if the entry is not there
            local listing
            if ! listing=$(gh api "/repos/$REPO/contents/$1?ref=$3" 2>/dev/null); then
              # This function is called in a command substitution, so its diagnostics go to stderr or they are
              # captured as its result and lost. `set -e` in the caller turns the non-zero exit into a refusal.
              echo "::error::cannot list $1 at $3, so this run cannot establish what $1/$2 is there" >&2
              exit 1
            fi
            printf '%s' "$listing" | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const found = JSON.parse(s).find(item => item.name === process.argv[1]);
                process.stdout.write(found?.sha ?? "");
              });
            ' "$2"
          }
          altered=""
          for pair in ".github/workflows:verifier-receipt.yml" ".github:verifier-receipt"; do
            dir="${pair%%:*}"; name="${pair##*:}"
            on_main=$(object_id "$dir" "$name" main)
            on_candidate=$(object_id "$dir" "$name" "$CANDIDATE_SHA")
            echo "$dir/$name: main=${on_main:-<absent>} candidate=${on_candidate:-<absent>}"
            if [ "$on_main" != "$on_candidate" ]; then
              altered="$altered $dir/$name"
            fi
          done
          if [ -n "$altered" ]; then
            echo "::error::this candidate alters the receipt authority ($altered), so its receipt may not approve it"
            exit 1
          fi
          echo "the candidate leaves every authority object exactly as main holds it"

  measure:
    name: measure
    needs: trust
    runs-on: ubuntu-latest
    # WHY A BOUND, AND WHY THIS ONE. The runner invokes the candidate's suite, and a candidate's suite can
    # hang: a review reproduced exactly that on this repository's own coordinator suite under an unusual
    # TMPDIR, killing it at 300s with the stream still open. With no bound here the measure step blocks until
    # GitHub's 360-minute job default cancels it - six hours of a hosted runner, on a workflow that triggers on
    # every pull request touching .github/verifier-receipt/**, and a cancellation carries no diagnostic saying
    # what hung. Nothing is minted either way (emit needs: measure), so this is about cost and legibility, not
    # about safety.
    #
    # The bound: the pinned `coordinator` runner completes in 289s measured end to end (3667 tests), so the
    # suite itself needs ~5 minutes. 20 gives it four times that, plus the two checkouts and the upload, plus
    # room for a hosted runner slower than the machine that was measured - while turning a hang into a red job
    # in a third of an hour instead of six. Raise it if a runner key is ever added whose suite is genuinely
    # longer; do not raise it to accommodate a suite that hangs.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the authority at the trusted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.trust.outputs.trusted_sha }}
          path: authority
          persist-credentials: false

      - name: Check out the candidate at exactly the requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.trust.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Record which commit was checked out
        id: candidate
        working-directory: candidate
        env:
          CANDIDATE_SHA: ${{ needs.trust.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "$CANDIDATE_SHA" ]; then
            echo "::error::asked to measure $CANDIDATE_SHA but checked out $head"
            exit 1
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      # THE TRUSTED JOB CHOOSES THE RUNNER. The command is read out of the authority checkout, by key, as JSON -
      # not from the candidate's package.json, not from a dispatch input, not from any file in the candidate's
      # tree. The candidate contributes the code under test and nothing about how it is run.
      - name: Resolve the runner command from the protected enum
        id: runner
        env:
          RUNNER_KEY: ${{ needs.trust.outputs.runner_key }}
        run: |
          set -euo pipefail
          command=$(node -e '
            const fs = require("node:fs");
            const spec = JSON.parse(fs.readFileSync("authority/.github/verifier-receipt/runners.json", "utf8"));
            const runner = spec.runners?.[process.env.RUNNER_KEY];
            if (!runner?.command) { console.error("no such runner key: " + process.env.RUNNER_KEY); process.exit(1); }
            process.stdout.write(runner.command);
          ')
          echo "command<<EOF" >> "$GITHUB_OUTPUT"
          echo "$command" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "runner \"$RUNNER_KEY\": $command"

      # THE CAPTURE IS HASHED AS IT PASSES THROUGH A TRUSTED PROCESS, NOT READ BACK FROM A FILE.
      #
      # A review defeated the previous form of this step. It redirected the runner's output into
      # $RUNNER_TEMP/capture/suite.out and the NEXT step hashed that file - but the candidate's own test bodies
      # run inside THIS step, as this step's user, with RUNNER_TEMP in their environment, so a test could write
      # a forged TAP stream beside the capture and rename(2) it over the top. The reporter's still-open fd was
      # detached onto the unlinked inode, the forged bytes were whole, and the trusted step then hashed THEM:
      # the artifact digest, the meta and the attestation were all computed over bytes the candidate wrote.
      # Every provenance check downstream authenticated which JOB uploaded the artifact; none authenticated who
      # wrote the bytes inside it.
      #
      # So the capture program below spawns the runner itself, hashes every byte in its own memory as it
      # arrives, takes the suite's exit status from waitpid rather than from a step output the measured code can
      # append to, and creates the capture directory and writes both files only after the stream has closed -
      # when the runner and its children are gone. While the candidate's code is running there is no capture
      # file to rename over, and the digest never touches the disk the candidate can write.
      #
      # WHAT THAT DOES NOT DO, said plainly here because the header of this file used to overclaim it: the
      # measured tests SHARE this output stream. A candidate whose test bodies print their own well-formed TAP
      # into stdout are hashed exactly as faithfully as the reporter's own lines. This step establishes that the
      # artifact holds the bytes the runner produced; it does not establish that those bytes are truthful, and
      # nothing in this workflow can, because the measurement and the measured code write to one fd.
      #
      # AND WHAT IS STILL OPEN, which a review ruled blocking rather than residual: everything in this step runs
      # as ONE UID, so a candidate that detaches a process outliving its own suite rewrites suite.out and
      # capture-meta.json together in the gap between this step and the upload below. What the capture program
      # now does about it is bind the suite's exit status to the bytes - a trailer inside the hashed stream, and
      # the same number published as this job's `exit` output for the emit job to cross-check - so that forgery
      # is refused by name at `capture.suite_exit`. A forger that also appends to $GITHUB_OUTPUT beats that.
      # Closing it takes a different uid for the measured suite (a `container:` with a USER it cannot escape, or
      # `sudo -u nobody` with the capture directory owned by the runner user), which is an infrastructure change
      # this branch does not make. See capture-stream.mjs for the full statement.
      - name: Run the protected runner against the candidate, hashing its output as it passes through
        id: suite
        env:
          RUNNER_COMMAND: ${{ steps.runner.outputs.command }}
          RUNNER_KEY: ${{ needs.trust.outputs.runner_key }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.head }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.tree }}
          TRUSTED_SOURCE_SHA: ${{ needs.trust.outputs.trusted_sha }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          CAPTURE_DIR: ${{ runner.temp }}/capture
          JOB_NAME: measure
        run: node authority/.github/verifier-receipt/capture-stream.mjs

      # The trusted job's OWN artifact, holding only files this job wrote. No candidate file is uploaded, and the
      # emitting job downloads no candidate file at all.
      - name: Upload the trusted job's capture, and nothing else
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: measure-capture
          path: ${{ runner.temp }}/capture
          if-no-files-found: error
          retention-days: 30

      - name: Normalise the digest GitHub computed for the artifact
        id: artifact
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) normalised="$DIGEST" ;;
            "") echo "::error::upload-artifact reported no digest for the capture"; exit 1 ;;
            *) normalised="sha256:$DIGEST" ;;
          esac
          echo "digest=$normalised" >> "$GITHUB_OUTPUT"
          echo "id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact $ARTIFACT_ID digest $normalised"

    outputs:
      head: ${{ steps.candidate.outputs.head }}
      tree: ${{ steps.candidate.outputs.tree }}
      # THE ONE FACT ABOUT THIS MEASUREMENT THAT DOES NOT TRAVEL INSIDE THE ARTIFACT, and the emit job below
      # now reads it. A review found this output declared here with no consumer anywhere in the repository,
      # which meant the suite's exit status reached the emitter only through capture-meta.json - a file the
      # forgery that rewrites the capture rewrites beside it. The capture program takes it from waitpid, writes
      # it into the hashed stream as the capture's trailer, and publishes it here; the emitter refuses any
      # disagreement between the three by name.
      exit: ${{ steps.suite.outputs.exit }}
      capture_sha256: ${{ steps.suite.outputs.capture_sha256 }}
      body_sha256: ${{ steps.suite.outputs.body_sha256 }}
      artifact_id: ${{ steps.artifact.outputs.id }}
      artifact_digest: ${{ steps.artifact.outputs.digest }}

  emit:
    name: Emit the receipt from this run's own capture, and judge it
    needs: [trust, measure]
    runs-on: ubuntu-latest
    # This job runs no candidate code - it fetches this run's own evidence through the API and judges it - so
    # its bound is set by the emitter's own test suite, the API reads and the artifact download rather than by
    # a candidate's suite. 15 minutes is well above anything observed and still refuses a wedged download
    # rather than holding a runner for six hours.
    timeout-minutes: 15
    # NO SIGNING PERMISSION IN THE JOB THAT RUNS PULL-REQUEST-SUPPLIED CODE. A review put it exactly: until this
    # authority exists on the default branch, the trust job's fallback runs the emitter, the capture program,
    # the runner enum, the rehearsal pin AND the emitter's own test suite from the pull request head - and this
    # job used to hold `id-token: write` and `attestations: write` while doing it. Minting is now a separate
    # job below, which is the only job of this workflow that can sign anything and which cannot run on a
    # pull_request event at all.
    permissions:
      contents: read
      actions: read
    outputs:
      admissible: ${{ steps.gate.outputs.admissible }}
      receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
    steps:
      - name: Check out the authority at the trusted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.trust.outputs.trusted_sha }}
          path: authority
          persist-credentials: false

      # The emitter's own tests, run from the trusted checkout before it judges anything. They stub `gh`, so they
      # need no token and no network, and they assert the refusals by name.
      - name: Test the emitter
        run: node --test --test-reporter=tap authority/.github/verifier-receipt/test/*.test.mjs

      # No download-artifact step: the emitter locates this run's artifact through the API itself, so no file
      # arrives in this workspace that the emitter did not fetch and digest.
      - name: Emit the canonical receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_SOURCE_SHA: ${{ needs.trust.outputs.trusted_sha }}
          TRUSTED_SOURCE_ORIGIN: ${{ needs.trust.outputs.trusted_origin }}
          MEASURE_JOB_NAME: measure
          MEASURE_ARTIFACT_NAME: measure-capture
          MEASURE_ARTIFACT_ID: ${{ needs.measure.outputs.artifact_id }}
          MEASURE_ARTIFACT_DIGEST: ${{ needs.measure.outputs.artifact_digest }}
          # The measure job's own output, taken from waitpid in its trusted capture process. The emitter
          # requires the capture's trailer and its meta to agree with this number, so a capture rewritten after
          # the trusted job wrote it is refused at `capture.suite_exit` instead of being read as a measurement.
          MEASURE_SUITE_EXIT: ${{ needs.measure.outputs.exit }}
          CANDIDATE_SHA: ${{ needs.measure.outputs.head }}
          CANDIDATE_TREE: ${{ needs.measure.outputs.tree }}
          RUNNER_KEY: ${{ needs.trust.outputs.runner_key }}
          RUNNER_SPEC_PATH: ${{ github.workspace }}/authority/.github/verifier-receipt/runners.json
          OUT_PATH: ${{ github.workspace }}/receipt.json
        run: node authority/.github/verifier-receipt/emit-receipt.mjs

      - name: Refuse to emit a receipt that establishes nothing
        id: gate
        run: |
          set -euo pipefail
          node -e "
            const receipt = JSON.parse(require('node:fs').readFileSync('receipt.json', 'utf8'));
            const summary = receipt.named_tests_summary ?? {};
            const terms = receipt.terms ?? null;
            const verdict = receipt.conclusion?.verdict ?? null;
            console.log('verdict', verdict, 'named', summary.named, 'pass', summary.pass, 'fail', summary.fail, 'absent', summary.absent);
            console.log('terms', JSON.stringify(receipt.terms_summary ?? {}));
            console.log('reasons', JSON.stringify(receipt.conclusion?.reasons ?? []));
            console.log('admissible as pin:', receipt.provenance?.admissible_as_pin, receipt.provenance?.inadmissibility_reasons ?? []);
            if (verdict !== 'success') { console.error('::error::the receipt does not record a successful measurement of the named tests'); process.exit(1); }
            if (!(summary.named > 0)) { console.error('::error::the receipt names no tests, so it establishes nothing about any term'); process.exit(1); }
            if (!Array.isArray(terms) || terms.length === 0) { console.error('::error::the receipt enumerates no terms'); process.exit(1); }
            // The per-term form of the rule above. A claim-wide \`named > 0\` is satisfied by ONE covered term,
            // so a term naming no test rode to success on a sibling's coverage; the emitter now refuses that in
            // the verdict, and this step refuses it again by name.
            const uncovered = terms.filter(term => !(term.named > 0)).map(term => term.id);
            if (uncovered.length > 0) { console.error('::error::these terms name no tests, so this run establishes nothing about them: ' + uncovered.join(', ')); process.exit(1); }
            // And the same rule at the level of a single test. 'pass' is the only status that is a
            // measurement: 'skip' is a body the runner never executed, 'suite' is a describe() block matched
            // where a test was named, and both used to read as a pass. The emitter refuses each of them in the
            // verdict; this step refuses them again, by test name and by the status it was given.
            const unmeasured = (receipt.named_tests ?? []).filter(named => named.status !== 'pass');
            if (unmeasured.length > 0) { console.error('::error::these named tests were not measured as passing in this run: ' + unmeasured.map(named => named.name + ' [' + named.status + ']').join(', ')); process.exit(1); }
            // TERMS RECONCILED AGAINST THE ROWS THEY CLAIM TO COUNT. A review found this line missing and it
            // is the one line that made the rest of this step a re-read rather than a second reading: every
            // check above takes terms[].named on trust, so a receipt whose terms[] row claims coverage that no
            // named_tests row supports passed with admissible=true. Three forgeries did exactly that - a second
            // terms[] row for an entry with no test of its own, terms[].named as the string '1' (which
            // satisfies !(term.named > 0) without being a count), and named_tests emptied while the summary and
            // the terms still said one pass. None of them is reachable by a candidate, which is why the review
            // ruled it MEDIUM; all three are reachable by an emitter bug, which is the whole reason a second
            // reader exists.
            //
            // So the counts are recomputed here from named_tests, which is the receipt's own per-test evidence
            // and one step closer to the capture, and a term whose row does not agree with the rows attributed
            // to its entry is refused by name. The totals are reconciled too, so a row attributed to no term at
            // all - or counted under two - cannot hide inside agreeing per-term numbers.
            const rows = Array.isArray(receipt.named_tests) ? receipt.named_tests : null;
            if (rows === null) { console.error('::error::the receipt carries no named_tests list, so nothing supports what its terms claim'); process.exit(1); }
            const tallied = new Map();
            for (const row of rows) {
              const bucket = tallied.get(row.entry) ?? { named: 0, pass: 0 };
              bucket.named += 1;
              if (row.status === 'pass') bucket.pass += 1;
              tallied.set(row.entry, bucket);
            }
            const unsupported = [];
            let claimedNamed = 0;
            let claimedPass = 0;
            for (const term of terms) {
              if (!Number.isInteger(term.named) || !Number.isInteger(term.pass)) {
                unsupported.push(String(term.id) + ' reports named=' + JSON.stringify(term.named) + ' pass=' + JSON.stringify(term.pass) + ', which are not counts');
                continue;
              }
              claimedNamed += term.named;
              claimedPass += term.pass;
              const bucket = tallied.get(term.entry) ?? { named: 0, pass: 0 };
              if (term.named !== bucket.named || term.pass !== bucket.pass) {
                unsupported.push(String(term.id) + ' (entry ' + JSON.stringify(term.entry) + ') claims named=' + term.named + ' pass=' + term.pass + ', but named_tests holds ' + bucket.named + ' test(s) for that entry, ' + bucket.pass + ' of them passing');
              }
            }
            if (unsupported.length > 0) { console.error('::error::these terms claim coverage that no named test row of this receipt supports: ' + unsupported.join('; ')); process.exit(1); }
            const passingRows = rows.filter(row => row.status === 'pass').length;
            if (claimedNamed !== rows.length || claimedPass !== passingRows) {
              console.error('::error::the terms account for ' + claimedNamed + ' named test(s) and ' + claimedPass + ' passing, but the receipt lists ' + rows.length + ' and ' + passingRows);
              process.exit(1);
            }
            if (summary.named !== rows.length || summary.pass !== passingRows) {
              console.error('::error::named_tests_summary says named=' + JSON.stringify(summary.named) + ' pass=' + JSON.stringify(summary.pass) + ', but the receipt lists ' + rows.length + ' named test(s), ' + passingRows + ' passing');
              process.exit(1);
            }
            // ONE MEASUREMENT MAY NOT BE THE EVIDENCE FOR TWO TERMS. Ten entries with distinct, well-formed ids
            // all naming the SAME passing test reported ten terms established off one point - the pooling the
            // commit before this one claimed to have closed, which it had closed only for reused IDS. The
            // emitter refuses such a manifest by name; this is the second reader of the same rule, and it reads
            // the rows rather than the count, so an emitter that ever stopped refusing is caught here.
            const claimants = new Map();
            for (const row of rows) claimants.set(row.name, new Set([...(claimants.get(row.name) ?? []), row.entry]));
            const shared = [...claimants.entries()].filter(([, at]) => at.size > 1).map(([name, at]) => name + ' (entries ' + [...at].join(', ') + ')');
            if (shared.length > 0) { console.error('::error::these named tests are the sole evidence for more than one term, so this receipt does not say which term each measurement establishes: ' + shared.join('; ')); process.exit(1); }
            if (summary.distinct_names !== claimants.size) { console.error('::error::named_tests_summary says distinct_names=' + JSON.stringify(summary.distinct_names) + ', but the receipt lists ' + claimants.size + ' distinct measured name(s)'); process.exit(1); }
            // A SUCCESS BESIDE A RED SUITE MUST SAY SO, AND EVERY RED TEST MUST BE OUTSIDE WHAT THE CLAIM RESTS
            // ON. A review produced verdict success with reasons [] for a run the runner exited 1 on, with two
            // failing tests in the same tree and nothing in the receipt a reader could act on. The verdict is
            // still about the named tests - that is what a term is established by - but this step refuses to
            // publish an admissible output for a red run unless the receipt enumerates its failing tests, says
            // in its conclusion that the suite was red, and none of those failing tests is one the claim names.
            const suite = receipt.suite ?? {};
            const conclusion = receipt.conclusion ?? {};
            const red = suite.state === 'red' || String(suite.exit) !== '0' || (suite.not_ok ?? 0) + (suite.cancelled ?? 0) > 0;
            if (red) {
              if (suite.state !== 'red' || conclusion.suite_state !== 'red') { console.error('::error::the measured suite is red, but this receipt does not say so: suite.state=' + JSON.stringify(suite.state) + ' conclusion.suite_state=' + JSON.stringify(conclusion.suite_state)); process.exit(1); }
              if (!Array.isArray(conclusion.qualifications) || conclusion.qualifications.length === 0) { console.error('::error::this receipt records an UNQUALIFIED success beside a suite the runner reported red; a success beside a red run must state what it does and does not cover'); process.exit(1); }
              const failing = suite.failing_tests;
              if (!Array.isArray(failing)) { console.error('::error::the measured suite is red and this receipt does not enumerate which tests failed, so nothing shows they are outside what the claim rests on'); process.exit(1); }
              if ((suite.not_ok ?? 0) > 0 && failing.length === 0) { console.error('::error::this receipt reports ' + suite.not_ok + ' failing point(s) and names none of them'); process.exit(1); }
              const measured = new Set(rows.map(row => row.name));
              const inside = failing.filter(name => measured.has(name));
              if (inside.length > 0) { console.error('::error::these failing tests of the measured run ARE named by this claim, so this run establishes nothing about the terms that name them: ' + inside.join(', ')); process.exit(1); }
              console.log('qualified success: the suite is red and all ' + failing.length + ' failing test(s) are outside the ' + measured.size + ' name(s) this claim rests on');
            }
            // AND THE ADMISSIBLE OUTPUT IS THE RECEIPT'S OWN FIELD, NOTHING ELSE. A review bypassed this by
            // writing admissible=true beside a receipt whose body said false. That is caught here and again in
            // the guard step below, which compares this output to the same field; the attest job re-reads it a
            // third time out of the subject it is about to sign.
            const admissible = receipt.provenance?.admissible_as_pin === true;
            if (admissible && verdict !== 'success') { console.error('::error::this receipt calls itself admissible as a pin while its verdict is ' + verdict); process.exit(1); }
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'admissible=' + admissible + '\n');
          "

      # THE BYPASS, CAUGHT BY A STEP THAT READS BOTH SIDES. A review wrote `admissible=true` into the gate's
      # own output beside a receipt whose body said `admissible_as_pin: false`, and the attest step's `if:`
      # selected on it - the mark the emitter computes was not merely unenforced, it was bypassable. This step
      # compares the output the attest job's condition reads against the field in the receipt itself, and turns
      # a disagreement into a red job BEFORE anything can be signed. It is not the whole answer (see the note
      # on the attest job below); it is the answer to a step output that does not match its own evidence.
      - name: Refuse a gate output that disagrees with the receipt it was computed from
        id: guard
        env:
          GATE_SAYS: ${{ steps.gate.outputs.admissible }}
        run: |
          set -euo pipefail
          node -e "
            const receipt = JSON.parse(require('node:fs').readFileSync('receipt.json', 'utf8'));
            const says = String(receipt.provenance?.admissible_as_pin === true);
            const gate = String(process.env.GATE_SAYS || '');
            if (gate !== says) {
              console.error('::error::the gate published admissible=' + JSON.stringify(gate) + ' for a receipt whose own body says admissible_as_pin=' + says + '; nothing this run produced may be signed');
              process.exit(1);
            }
            console.log('the gate output and the receipt agree: admissible_as_pin=' + says);
          "

      - name: Record the receipt's digest for the job that may sign it
        id: receipt
        run: |
          set -euo pipefail
          echo "sha256=$(sha256sum receipt.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Say, in the log, why this receipt was not attested
        if: steps.gate.outputs.admissible != 'true'
        run: |
          set -euo pipefail
          node -e "
            const receipt = JSON.parse(require('node:fs').readFileSync('receipt.json', 'utf8'));
            const why = receipt.provenance?.inadmissibility_reasons ?? ['admissible_as_pin is not true'];
            console.log('::warning::this receipt is not admissible as a pin and was NOT attested: ' + why.join('; '));
          "

      - name: Upload the receipt as an artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: verifier-receipt
          path: receipt.json
          retention-days: 90

      - name: Print what a manifest must pin
        run: |
          set -euo pipefail
          digest=$(sha256sum receipt.json | cut -d' ' -f1)
          {
            echo "### Receipt for \`${{ needs.measure.outputs.head }}\`"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| workflow | ${{ github.workflow_ref }} |"
            echo "| authority commit | ${{ needs.trust.outputs.trusted_sha }} (${{ needs.trust.outputs.trusted_origin }}) |"
            echo "| run id | ${{ github.run_id }} |"
            echo "| run attempt | ${{ github.run_attempt }} |"
            echo "| candidate | ${{ needs.measure.outputs.head }} |"
            echo "| candidate tree | ${{ needs.measure.outputs.tree }} |"
            echo "| runner key | ${{ needs.trust.outputs.runner_key }} |"
            echo "| capture artifact | measure-capture (id ${{ needs.measure.outputs.artifact_id }}, ${{ needs.measure.outputs.artifact_digest }}) |"
            echo "| receipt artifact | verifier-receipt (id ${{ steps.upload.outputs.artifact-id }}) |"
            echo "| receipt sha256 | sha256:${digest} |"
            echo "| admissible as pin | ${{ steps.gate.outputs.admissible }} (attested only when true) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # THE ONLY JOB OF THIS AUTHORITY THAT CAN SIGN ANYTHING.
  #
  # It used to be a step of `emit`, selected by `if: steps.gate.outputs.admissible == 'true'`, in a job holding
  # `id-token: write` and `attestations: write` for every run - including the pull-request rehearsals in which
  # the emitter, the capture program, the runner enum, the rehearsal pin and the emitter's own test suite all
  # come from the pull request head, because this authority is not yet on the default branch. A review wrote
  # `admissible=true` into that step output beside a receipt whose body said `admissible_as_pin: false` and the
  # attest step selected. Three things change here, and each is stated with what it is worth:
  #
  #   1. SIGNING IS ITS OWN JOB, and it is the only place in this workflow holding an attestation permission.
  #      `emit` - the job that runs pull-request-supplied code - now holds none at all, so a rehearsal cannot
  #      sign even by accident.
  #   2. IT CANNOT RUN ON A REHEARSAL. Its condition is `workflow_dispatch` on `refs/heads/main`: facts about
  #      the run, reported by GitHub, which no step of any job computes and no output can carry.
  #   3. IT RE-READS THE SUBJECT IT IS ABOUT TO SIGN. The receipt is fetched as this run's own artifact, its
  #      digest is checked against the one the emit job recorded, and `provenance.admissible_as_pin`,
  #      `conclusion.verdict` and the run identity are read out of the file itself - not out of a job output.
  #      The bypass therefore has to beat the receipt rather than the variable beside it.
  #
  # WHERE THIS STOPS, because the comment this replaces overstated exactly that. On a `pull_request` event
  # GitHub runs the workflow DEFINITION from the pull request head, so for such a run this job's condition, its
  # checks and its permissions block are all the candidate author's, and nothing written in this file binds
  # them. What binds them is outside these files: whether this repository's Actions settings grant a pull
  # request run `attestations: write` at all, whether such runs require approval - and, decisively for anyone
  # consuming these receipts, that a consumer requires `provenance.admissible_as_pin === true`,
  # `conclusion.verdict === 'success'` AND an attestation whose workflow ref is `refs/heads/main`, rather than
  # treating the existence of an attestation as the trust anchor. That consumer change is specified in
  # /home/bawes/work/consumer-required-changes.md and belongs to the branch that holds the consumer.
  attest:
    name: Attest a receipt this authority may vouch for
    needs: [trust, measure, emit]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.emit.outputs.admissible == 'true'
    runs-on: ubuntu-latest
    # One download, one digest, one signature. Bounded like every other job of this workflow.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Fetch the receipt this run's emit job produced
        uses: actions/download-artifact@v4
        with:
          name: verifier-receipt

      - name: Refuse a subject that is not the receipt the emit job recorded
        env:
          EXPECTED: ${{ needs.emit.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          actual=$(sha256sum receipt.json | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::the emit job recorded sha256:$EXPECTED for its receipt, but the artifact this job fetched hashes to sha256:$actual"
            exit 1
          fi
          echo "subject receipt.json sha256:$actual, as the emit job recorded it"

      - name: Read admissibility out of the subject itself, not out of a job output
        env:
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          node -e "
            const receipt = JSON.parse(require('node:fs').readFileSync('receipt.json', 'utf8'));
            const refuse = message => { console.error('::error::' + message); process.exit(1); };
            if (receipt.provenance?.admissible_as_pin !== true) refuse('this receipt says admissible_as_pin=' + JSON.stringify(receipt.provenance?.admissible_as_pin) + ', so this authority will not sign it: ' + JSON.stringify(receipt.provenance?.inadmissibility_reasons ?? []));
            if (receipt.conclusion?.verdict !== 'success') refuse('this receipt records verdict ' + JSON.stringify(receipt.conclusion?.verdict) + ', so there is nothing in it to vouch for');
            if (String(receipt.run?.id) !== String(process.env.RUN_ID)) refuse('this receipt was produced by run ' + JSON.stringify(receipt.run?.id) + ', not by run ' + process.env.RUN_ID);
            if (receipt.workflow?.event !== 'workflow_dispatch' || receipt.workflow?.head_branch !== 'main') refuse('this receipt records event ' + JSON.stringify(receipt.workflow?.event) + ' on ' + JSON.stringify(receipt.workflow?.head_branch) + ', which is not a dispatch of the protected default branch');
            if (process.env.EVENT !== 'workflow_dispatch' || process.env.REF !== 'refs/heads/main') refuse('this job is running on ' + process.env.EVENT + ' at ' + process.env.REF + ', which may not sign a receipt');
            console.log('the receipt names itself admissible, verdict success, run ' + receipt.run?.id + ' dispatched on main');
          "

      - name: Attest the receipt
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: receipt.json
