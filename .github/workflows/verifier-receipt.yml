name: Verifier receipt

# The receipt producer: it answers one question about one commit - what did that commit's own suite report, and
# what does its claim name?
#
# The two-job split IS the security property, and it exists because a review defeated the single-job version:
# run the candidate's suite and emit the receipt in one job, and the code being measured is the code deciding
# what the receipt says. So the untrusted half is quarantined.
#
#   measure - checks out the candidate, runs its suite, uploads nothing but the TAP the runner captured plus
#             the claim as data. No id-token, no attestation permission.
#   emit    - checks out the measurer from the dispatching ref (protected main) and runs it. It never checks
#             out the candidate, so no candidate code executes in the job that emits and attests. The candidate
#             reaches it only as data: the TAP artifact, the manifest, the pins.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Commit to measure
        required: true
      suite_command:
        description: Override the suite command (defaults to the candidate's test:coordinator script)
        required: false

permissions:
  contents: read
  actions: read

jobs:
  measure:
    name: Run the candidate's suite and capture the TAP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the candidate at exactly the requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0

      - name: Record which commit was checked out
        id: candidate
        working-directory: candidate
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "${{ inputs.candidate_sha }}" ]; then
            echo "::error::asked to measure ${{ inputs.candidate_sha }} but checked out $head"
            exit 1
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      # The suite command is the candidate's own, so it is passed through the environment rather than spliced
      # into a shell body, where a quoting mistake turns a command into data.
      - name: Run the suite the candidate declares, capturing its TAP
        id: suite
        env:
          SUITE_COMMAND: ${{ inputs.suite_command }}
        working-directory: candidate
        run: |
          set -uo pipefail
          if [ -z "${SUITE_COMMAND}" ]; then
            SUITE_COMMAND=$(node -e "const p=require('./package.json');const c=p.scripts['test:coordinator'];if(!c){console.error('no test:coordinator script');process.exit(1)};process.stdout.write(c)")
          fi
          echo "suite command: ${SUITE_COMMAND}"
          set +e
          bash -euo pipefail -c "${SUITE_COMMAND}" > "$RUNNER_TEMP/suite.tap" 2>&1
          exit_code=$?
          set -e
          echo "exit=$exit_code" >> "$GITHUB_OUTPUT"
          echo "captured $(wc -l < "$RUNNER_TEMP/suite.tap") lines, suite exit $exit_code"

      - name: Upload the measurement and the claim, and nothing else
        uses: actions/upload-artifact@v4
        with:
          name: candidate-measurement
          path: |
            ${{ runner.temp }}/suite.tap
            candidate/.github/coordinator/service/claim-manifest.json
            candidate/.github/coordinator/service/verifier-receipts.json
          if-no-files-found: warn
          retention-days: 30

    outputs:
      head: ${{ steps.candidate.outputs.head }}
      tree: ${{ steps.candidate.outputs.tree }}
      exit: ${{ steps.suite.outputs.exit }}

  emit:
    name: Emit and attest the receipt from the measurement
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the measurer from the dispatching ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: measurer

      - name: Refuse to run if the candidate's diff touches the authority
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          changed=$(gh api "/repos/${{ github.repository }}/compare/main...$CANDIDATE_SHA" --jq '.files[].filename')
          touched=$(printf '%s\n' "$changed" | grep -E '(^|/)\.github/(workflows/verifier-receipt\.yml|verifier-receipt/)' || true)
          if [ -n "$touched" ]; then
            echo "::error::this candidate modifies the receipt authority, so its receipt may not approve it"
            printf '%s\n' "$touched"
            exit 1
          fi

      - name: Download the measurement
        uses: actions/download-artifact@v4
        with:
          name: candidate-measurement
          path: measurement

      - name: Emit the canonical receipt
        env:
          CANDIDATE_SHA: ${{ needs.measure.outputs.head }}
          CANDIDATE_TREE: ${{ needs.measure.outputs.tree }}
          MEASURED_SUITE_EXIT: ${{ needs.measure.outputs.exit }}
          TAP_PATH: ${{ github.workspace }}/measurement/suite.tap
          MANIFEST_PATH: ${{ github.workspace }}/measurement/claim-manifest.json
          OUT_PATH: ${{ github.workspace }}/receipt.json
        run: node measurer/.github/verifier-receipt/emit-receipt.mjs

      - name: Refuse to emit a receipt that establishes nothing
        run: |
          set -euo pipefail
          node -e "
            const receipt = JSON.parse(require('node:fs').readFileSync('receipt.json', 'utf8'));
            const summary = receipt.named_tests_summary ?? {};
            const verdict = receipt.conclusion?.verdict ?? null;
            console.log('verdict', verdict, 'named', summary.named, 'pass', summary.pass, 'fail', summary.fail, 'absent', summary.absent);
            if (verdict !== 'success') { console.error('::error::the receipt does not record a successful measurement of the named tests'); process.exit(1); }
            if (!(summary.named > 0)) { console.error('::error::the receipt names no tests, so it establishes nothing about any term'); process.exit(1); }
          "

      - name: Attest the receipt
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: receipt.json

      - name: Upload the receipt as an artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: verifier-receipt
          path: receipt.json
          retention-days: 90

      - name: Print what a manifest must pin
        run: |
          set -euo pipefail
          digest=$(sha256sum receipt.json | cut -d' ' -f1)
          {
            echo "### Receipt for \`${{ needs.measure.outputs.head }}\`"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| workflow | ${{ github.workflow_ref }} |"
            echo "| dispatching commit | ${{ github.sha }} |"
            echo "| run id | ${{ github.run_id }} |"
            echo "| run attempt | ${{ github.run_attempt }} |"
            echo "| candidate | ${{ needs.measure.outputs.head }} |"
            echo "| candidate tree | ${{ needs.measure.outputs.tree }} |"
            echo "| artifact | verifier-receipt (id ${{ steps.upload.outputs.artifact-id }}) |"
            echo "| receipt sha256 | sha256:${digest} |"
          } >> "$GITHUB_STEP_SUMMARY"
